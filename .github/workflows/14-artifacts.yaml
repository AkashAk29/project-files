name: 14 - Using Artifacts

on:
  workflow_dispatch

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 14-Artifacts/react-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
      - name: Download cache dependencies
        uses: actions/cache@v3
        id: cache
        with:
          path: 14-Artifacts/react-app/node_modules
          key: deps-node-module-${{ hashFiles('14-Artifacts/react-app/package-lock.json') }}
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Unit tests
        run: npm run test
      - name: Build code
        run: npm run build
      - name: Upload build
        uses: actions/upload-artifacts
        with:
          name: app
          path: 14-Artifacts/react-app/build

  deploy:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Download build artifacts
        uses: actions/download-artifacts
        with:
          name: app
          path: build

      - name: Show folder structure
        run: ls -R