name: 18-2-reusable-workflow

on:
  workflow_dispatch:

jobs:
  deploy2:
    uses: ./.github/workflows/./.github/workflows/18-1-reusable-workflow.yaml
    with:
      target-directory: dummy-dir
  print-outputs:
    runs-on: ubuntu-latest
    needs: deploy2
    steps:
      - name: print-outputs
        run: |
          echo "Build status : ${{ needs.deploy2.outputs.build_status }}"
          echo "URL: ${{ needs.deploy2.outputs.deploy_url}}"
