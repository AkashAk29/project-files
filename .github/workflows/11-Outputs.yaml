name: 11 - Working with Outputs

on:
  workflow_dispatch:
    inputs:
      status:
        type: choice
        options:
          - success
          - failure
        default: success

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build-status: ${{steps.build.outputs.status}}
      output-status: ${{steps.build.outputs.output1}}
    steps:
      - name: Print GITHUB_OUTPUT path
        run: echo "$GITHUB_OUTPUT"

      - name: Build
        id: build
        run: |
          echo "$GITHUB_OUTPUT"
          echo "status=${{inputs.status}}" >> "$GITHUB_OUTPUT"
          echo "output1=value1" >> "$GITHUB_OUTPUT"
          echo "output2=value2" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
          echo "mistake=true" > "$GITHUB_OUTPUT"
          

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: deploy
        if: ${{ needs.build.outputs.build-status == 'success' }}
        run: echo "Deploying"
      - name: print-outputs
        run: |
          echo " output1 : ${{needs.build.outputs.output-status}}"