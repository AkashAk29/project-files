name: 01 - Building Blocks

on: workflow_dispatch

jobs:
  echo-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Say Hello
        run: echo "Hello, world!"

  echo-goodbye:
    runs-on: ubuntu-latest
    steps:
      - name: failed step
        run: |
          echo "I fixed the fail"
          exit 0
      - name: Say goodbye
        run: echo "Goodbye!!"

