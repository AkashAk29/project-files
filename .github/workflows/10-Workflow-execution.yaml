name: 10-Controlling the Execution flow

on:
  workflow_dispatch:
    inputs:
      pass-unit-test:
        type: boolean
        description: Whether unit test will pass or not
        default: true

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - name: Lint and build
        run: echo "Linting and building"

  unit-test:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Running unit test
        run: echo "Running Tests...."
      - name: Failing test
        if: ${{ !inputs.pass-unit-test }}
        run: exit 1

  deploy-non-prod:
    runs-on: ubuntu-latest
    needs:
      - lint-build
      - unit-test
    steps:
      - name: Deployment to non-prod
        run: echo "Deploying to non-prod"

  e2e-tests:
    runs-on: ubuntu-latest
    needs: deploy-non-prod
    steps:
      - name: end to end testing
        run: echo "Running e2e tests"

  load-tests:
    runs-on: ubuntu-latest
    needs: deploy-non-prod
    steps:
      - name: load testing
        run: echo "Performing load testing"

  deploy-prod:
    runs-on: ubuntu-latest
    needs:
      - e2e-tests
      - load-tests
    steps:
      - name: deployment prod step
        run : echo "deploying to prod"